name: Build SXEngine (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🧠 Haxe
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      # 📦 haxelib
      - name: Setup haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib fixrepo

      # 🔥 DEPENDANCES SYSTEME (ultra important)
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib g++-multilib \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libopenal-dev \
            libudev-dev \
            libvorbis-dev \
            libflac-dev \
            libmpg123-dev \
            libvlc-dev libvlccore-dev \
            libcurl4-openssl-dev \
            git

      # 📚 LIBS HAXE (versions FIXES = pas de crash)
      - name: Install Haxe libraries
        run: |
          haxelib install lime 8.0.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install flixel-ui 2.6.1
          haxelib install hxcpp 4.3.2
          haxelib install format
          haxelib install hxp
          haxelib install tjson

      # 🔧 Setup lime (sinon build cassé)
      - name: Setup Lime
        run: |
          haxelib run lime setup

      # 🔧 Fix hxcpp (très important sur CI)
      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      # 🚀 BUILD (audio désactivé = évite crash linux)
      - name: Build Windows
        run: |
          haxelib run lime build windows -release -Dnoaudio

      # 📦 EXPORT
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SXEngine-Windows
          path: export/release/windows/bin
