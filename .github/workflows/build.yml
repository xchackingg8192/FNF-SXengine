name: Build SXEngine (Windows)

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev git

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install base libs
        run: |
          haxelib install lime -S
          haxelib install openfl -S
          haxelib install flixel -S
          haxelib install flixel-addons -S
          haxelib install flixel-ui -S
          haxelib install hxcpp -S
          haxelib install tjson -S

      - name: Install Psych / engine deps
        run: |
          haxelib git flixel https://github.com/HaxeFlixel/flixel.git
          haxelib git flixel-addons https://github.com/HaxeFlixel/flixel-addons.git
          haxelib git flixel-ui https://github.com/HaxeFlixel/flixel-ui.git
          haxelib git lime https://github.com/openfl/lime.git
          haxelib git openfl https://github.com/openfl/openfl.git

      - name: Install optional codecs (safe)
        run: |
          haxelib install hxCodec || true

      - name: Build Windows
        run: |
          haxelib run lime build windows -release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SXEngine-Windows
          path: export/release/windows/bin
