- name: SXEngine
  run: |
    haxelib setup ~/haxelib

    # Core Lime/OpenFL
    haxelib install lime --always
    haxelib install openfl --always

    # HaxeFlixel base
    haxelib install flixel --always
    haxelib install flixel-addons --always
    haxelib install flixel-ui --always

    # Build system / required libs
    haxelib install hxcpp --always
    haxelib install hxp --always
    haxelib install format --always
    haxelib install tjson --always

    # Audio / extras (Psych Engine common)
    haxelib install hxCodec --always || true
    haxelib install extension-webm || true
