name: Build SXEngine (Windows)

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Install system dependencies
        run: |
          sudo apt-get update

          # AUDIO (fix tes erreurs)
          sudo apt-get install -y libasound2-dev libpulse-dev libopenal-dev

          # GRAPHICS + SDL
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev

          # IMAGE / FONT / ETC
          sudo apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev

          # UTILS
          sudo apt-get install -y libmbedtls-dev libuv1-dev libsqlite3-dev git

      - name: Setup Haxelib
        run: |
          mkdir ~/haxelib
          haxelib setup ~/haxelib
          haxelib update

      - name: Install Haxe libs
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hxcpp
          haxelib install format
          haxelib install hxp
          haxelib install tjson

      - name: Setup Lime/OpenFL
        run: |
          haxelib run lime setup
          haxelib run lime rebuild windows

      - name: Build Windows
        run: |
          haxelib run lime build windows -release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SXEngine-Windows
          path: export/release/windows/bin
