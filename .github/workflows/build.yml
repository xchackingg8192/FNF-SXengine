name: Build SXEngine (Windows)

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install FULL dependencies (IMPORTANT)
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hxcpp
          haxelib install tjson
          haxelib install format
          haxelib install hxp
          haxelib install actuate
          haxelib install svg
          haxelib install mcover || true

      - name: Git dependencies (engine core)
        run: |
          haxelib git flixel https://github.com/HaxeFlixel/flixel.git
          haxelib git flixel-addons https://github.com/HaxeFlixel/flixel-addons.git
          haxelib git flixel-ui https://github.com/HaxeFlixel/flixel-ui.git
          haxelib git lime https://github.com/openfl/lime.git
          haxelib git openfl https://github.com/openfl/openfl.git

      - name: Optional codec support
        run: |
          haxelib install hxCodec || true

      - name: Build Windows
        run: |
          haxelib run lime build windows -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SXEngine-Windows
          path: export/release/windows/bin
